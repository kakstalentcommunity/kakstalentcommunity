name: Update repositories list

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-updates
  cancel-in-progress: false

jobs:
  repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild repositories section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # Public repos from organizations you want listed too, comma-separated (owner/name)
          EXTRA_REPOS: "cyfras/Apipoweredsaccoerp"
          MAX_REPOS: "8"
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          user = os.environ["GH_USER"]
          token = os.environ.get("GH_TOKEN", "")
          extra = [r.strip() for r in os.environ.get("EXTRA_REPOS", "").split(",") if r.strip()]
          limit = int(os.environ.get("MAX_REPOS", "8"))

          def get(url):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "readme-updater"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
                  return json.load(r)

          repos = get(f"https://api.github.com/users/{user}/repos?per_page=100&type=owner&sort=pushed")
          for full in extra:
              try:
                  repos.append(get(f"https://api.github.com/repos/{full}"))
              except Exception as e:
                  print(f"skip {full}: {e}")

          seen, picked = set(), []
          for r in repos:
              if r.get("fork") or r.get("archived") or r.get("private"):
                  continue
              if r["name"].lower() == user.lower():
                  continue
              if r["full_name"] in seen:
                  continue
              seen.add(r["full_name"])
              picked.append(r)

          picked.sort(key=lambda r: r.get("pushed_at") or "", reverse=True)
          picked = picked[:limit]

          def clean(t):
              return (t or "No description yet").replace("|", "/").replace("\n", " ").strip()

          lines = ["| Repository | Description | Language | ⭐ | Last push |", "|---|---|---|---|---|"]
          for r in picked:
              lines.append(
                  f"| [**{r['name']}**]({r['html_url']}) | {clean(r.get('description'))} | "
                  f"{r.get('language') or '—'} | {r.get('stargazers_count', 0)} | {(r.get('pushed_at') or '')[:10]} |"
              )
          block = "\n".join(lines)

          text = open("README.md", encoding="utf-8").read()
          pattern = re.compile(r"(<!--START_REPOS-->)(.*?)(<!--END_REPOS-->)", re.S)
          if not pattern.search(text):
              raise SystemExit("Markers <!--START_REPOS--> / <!--END_REPOS--> not found in README.md")
          text = pattern.sub(lambda m: f"{m.group(1)}\n{block}\n{m.group(3)}", text)
          open("README.md", "w", encoding="utf-8").write(text)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update repositories list"
            git pull --rebase
            git push
          fi
